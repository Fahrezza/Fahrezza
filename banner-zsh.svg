<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Fahreza's profile banner styled as a minimal zsh terminal" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'Ubuntu Mono', Consolas, 'Courier New', monospace; font-size: 16px; white-space: pre; }
    .pr { fill: #f2f2f2; font-weight: bold; }
    .cmd { fill: #7d7d85; }
    .out { fill: #d6d6da; }
    .key { fill: #8a8a92; }
    .title { fill: #8a8a92; font-size: 12.5px; }
    .foot { fill: #6d6d75; font-size: 13.5px; }
    .l { opacity: 0; animation: show 0.01s forwards; }
    .l1 { animation-delay: 0.3s; } .l2 { animation-delay: 1.0s; } .l3 { animation-delay: 1.7s; }
    .l4 { animation-delay: 2.2s; } .l5 { animation-delay: 2.5s; } .l6 { animation-delay: 2.8s; }
    .l7 { animation-delay: 3.4s; }
    .cur { fill: #d6d6da; opacity: 0; animation: blink 1s steps(1) infinite; animation-delay: 3.4s; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } .cur { animation: none; opacity: 1; } }
  </style>

  <!-- Window -->
  <rect x="0.5" y="0.5" width="899" height="339" rx="14" fill="#0e0e10" stroke="#2a2a2e"/>
  <line x1="1" y1="48" x2="899" y2="48" stroke="#232326"/>
  <circle cx="24" cy="24" r="6" fill="#3a3a3f"/>
  <circle cx="44" cy="24" r="6" fill="#3a3a3f"/>
  <circle cx="64" cy="24" r="6" fill="#3a3a3f"/>
  <text x="90" y="28" class="title">fahrezzac@intro: zsh</text>

  <!-- Commands -->
  <text x="28" y="94" class="l l1"><tspan class="pr">❯</tspan><tspan class="cmd"> echo "Hi there, I'm Fahreza"</tspan></text>
  <text x="28" y="122" class="l l2"><tspan class="out">Hi there, I'm Fahreza</tspan></text>

  <text x="28" y="166" class="l l3"><tspan class="pr">❯</tspan><tspan class="cmd"> cat about.txt</tspan></text>
  <text x="28" y="194" class="l l4"><tspan class="key">role   </tspan><tspan class="out">Tech Student</tspan></text>
  <text x="28" y="218" class="l l5"><tspan class="key">focus  </tspan><tspan class="out">Informatics, Web Dev, AI</tspan></text>
  <text x="28" y="242" class="l l6"><tspan class="key">status </tspan><tspan class="out">always learning &amp; building</tspan></text>

  <text x="28" y="286" class="l l7"><tspan class="pr">❯</tspan></text>
  <rect class="cur" x="47" y="272" width="9" height="18"/>

  <!-- Footer -->
  <line x1="1" y1="302" x2="899" y2="302" stroke="#232326"/>
  <text x="28" y="326" class="foot">fahrezzac@intro   zsh   utf-8   tech student</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
