<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Quote: I am the architect of my own destruction, with the last word crumbling away" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family:'JetBrains Mono','Fira Code','Ubuntu Mono',Consolas,'Courier New',monospace; font-size: 30px; font-weight: 700; white-space: pre; fill: #e8e8ec; }
    .k { transform-box: fill-box; transform-origin: center; animation: crumble 8s ease-in infinite; }
    @keyframes crumble {
      0%, 40% { transform: translate(0,0) rotate(0deg); opacity: 1; fill: #e8e8ec; }
      46% { transform: translate(0,2px) rotate(calc(var(--r) * 0.2deg)); opacity: 1; fill: #ff5a52; }
      70% { transform: translate(calc(var(--r) * 0.5px), 85px) rotate(calc(var(--r) * 1deg)); opacity: 0; fill: #ff5a52; }
      88% { transform: translate(0,0) rotate(0deg); opacity: 0; }
      100% { transform: translate(0,0) rotate(0deg); opacity: 1; fill: #e8e8ec; }
    }
    @media (prefers-reduced-motion: reduce) { .k { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="899" height="189" rx="14" fill="#09090b" stroke="#222226"/>
  <text x="90" y="100" textLength="522" lengthAdjust="spacing">I am the architect of my own </text>
  <text class="k" x="612" y="100" style="--r:-25;animation-delay:0ms">d</text>
  <text class="k" x="630" y="100" style="--r:12;animation-delay:130ms">e</text>
  <text class="k" x="648" y="100" style="--r:-1;animation-delay:260ms">s</text>
  <text class="k" x="666" y="100" style="--r:-14;animation-delay:390ms">t</text>
  <text class="k" x="684" y="100" style="--r:23;animation-delay:520ms">r</text>
  <text class="k" x="702" y="100" style="--r:10;animation-delay:650ms">u</text>
  <text class="k" x="720" y="100" style="--r:-3;animation-delay:780ms">c</text>
  <text class="k" x="738" y="100" style="--r:-16;animation-delay:910ms">t</text>
  <text class="k" x="756" y="100" style="--r:21;animation-delay:1040ms">i</text>
  <text class="k" x="774" y="100" style="--r:8;animation-delay:1170ms">o</text>
  <text class="k" x="792" y="100" style="--r:-5;animation-delay:1300ms">n</text>
